# The server and the web page in one container, with config in one volume and every download in
# another. The published image, so this file is the whole install and needs no checkout.
# docs/operating.md § Docker.
#
#   docker compose up -d                                                 the published image
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build   built from this checkout
#
# RHAPSODE_VERSION picks the image tag, and defaults to the minor line this file was released on, so
# `docker compose pull` takes every patch release and stops at the next minor, where the page's
# banner says what to change. A release, such as 0.1.24, pins exactly. Every package and the image
# share one version. .env.example is the rest of what goes beside this file.
name: rhapsode

services:
    server:
        # Anchored so the server is told the same reference, which is how GET /update says exactly
        # what to change for the next release. protocol.md § 9.
        image: &image maroonedsoftware/rhapsode:${RHAPSODE_VERSION:-0.1}
        # 99:100 on unraid, to match its shares.
        user: '${PUID:-10001}:${PGID:-10001}'
        environment:
            RHAPSODE_PIP_TRUSTED_HOSTS: ${RHAPSODE_PIP_TRUSTED_HOSTS:-}
            RHAPSODE_IMAGE: *image
            RHAPSODE_WEB_PORT: ${RHAPSODE_WEB_PORT:-8081}
        volumes:
            - config:/config
            - data:/data
        ports:
            # The API, for /speak and OpenAI clients. Install routes refuse callers here without the
            # management token, because a published port is never loopback to the core.
            - '127.0.0.1:${RHAPSODE_API_PORT:-8080}:8080'
            # The page. 127.0.0.1 is what keeps the install routes local: the page has no sign-in and
            # its proxy carries the token, so publishing this on the LAN gives everyone on it a way
            # to run pip here.
            - '127.0.0.1:${RHAPSODE_WEB_PORT:-8081}:8081'
        # Longer than server.shutdownGraceMs (20 s), or Docker's default of 10 s kills a worker
        # mid-sentence instead of letting it drain.
        stop_grace_period: 30s
        restart: unless-stopped

volumes:
    config:
    data:
