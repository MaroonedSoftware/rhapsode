# The server and the web page in one container, with config in one volume and every download in
# another. The published image, so this file is the whole install and needs no checkout; from a
# checkout, add compose.build.yaml to build it instead. docs/operating.md § Docker.
#
#   docker compose up -d
name: rhapsode

services:
    server:
        # `edge` for the tip of main, or a version to stay on one.
        image: ghcr.io/maroonedsoftware/rhapsode:${RHAPSODE_VERSION:-latest}
        # 99:100 on unraid, to match its shares.
        user: '${PUID:-10001}:${PGID:-10001}'
        environment:
            RHAPSODE_PIP_TRUSTED_HOSTS: ${RHAPSODE_PIP_TRUSTED_HOSTS:-}
        volumes:
            - config:/config
            - data:/data
        ports:
            # The API, for /speak and OpenAI clients. Install routes refuse callers here without the
            # management token, because a published port is never loopback to the core.
            - '127.0.0.1:${RHAPSODE_API_PORT:-8080}:8080'
            # The page. 127.0.0.1 is what keeps the install routes local: the page has no sign-in and
            # its proxy carries the token, so publishing this on the LAN gives everyone on it a way
            # to run pip here.
            - '127.0.0.1:${RHAPSODE_WEB_PORT:-8081}:8081'
        # Longer than server.shutdownGraceMs (20 s), or Docker's default of 10 s kills a worker
        # mid-sentence instead of letting it drain.
        stop_grace_period: 30s
        restart: unless-stopped

volumes:
    config:
    data:
