[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rhapsode-engine-chatterbox"
version = "0.1.14"
description = "Chatterbox for rhapsode: the engine the capability document was designed around."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "rhapsode-worker==0.1.14",  # Its own version, exactly, and bumped with it. protocol.md § 9.
    # Used directly, to turn a finished waveform into PCM. torch brings it too, but depending on it
    # through torch would make the adapter's own conversion untestable without several gigabytes.
    "numpy>=1.26",
    # Brings torch and several gigabytes of weights with it, which is exactly why every engine gets
    # its own virtualenv. The repository's shared dev venv installs this package with --no-deps, so
    # the adapter's own logic is under test without any of that.
    #
    # A commit on upstream's master rather than a release, because Nano (resemble-ai/chatterbox#542,
    # 2026-07-21) is in no release: PyPI's newest is 0.1.7 from March, and master still calls itself
    # 0.1.7 too, so no version floor can tell the two apart. An archive rather than git+https, though
    # the image carries git anyway: upstream names its own watermarker, resemble-perth, by
    # git+https at master, and pip cannot override one dependency's direct URL with another. Back to
    # a plain version floor once upstream publishes one with Nano,
    # and until then this adapter cannot go to PyPI, which refuses a direct reference.
    "chatterbox-tts @ https://github.com/resemble-ai/chatterbox/archive/5de7a54aa4e5e2baadb0182dde554908b48b85c2.zip",
    # Upstream's watermarker (resemble-perth 1.0.1) imports pkg_resources, which setuptools 81
    # removed. The import failure is swallowed, the watermarker becomes None, and every build then
    # fails to load with "'NoneType' object is not callable". A fresh venv got setuptools 84.
    "setuptools<81",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rhapsode_engine_chatterbox"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["torch.*", "chatterbox.*", "numpy.*", "huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The conformance test spawns a real worker running this adapter, so tests/ has to be importable for
# the harness that puts a stub where the weights would be.
pythonpath = ["tests"]
timeout = 60
