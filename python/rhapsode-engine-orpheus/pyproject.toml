[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rhapsode-engine-orpheus"
version = "0.1.9"
description = "Orpheus for rhapsode: a Llama that speaks in SNAC codes, and the second engine to perform cues."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "rhapsode-worker==0.1.9",  # Its own version, exactly, and bumped with it. protocol.md § 9.
    "numpy>=1.26",
    # The codec, which brings torch. torch's wheels carry their own CUDA.
    "snac>=1.2.1",
    "huggingface_hub>=0.23",
    # The Llama, by where it can run without compiling anything. On Linux x86_64 that is vLLM, whose
    # wheels bring CUDA, for the `full` build on an NVIDIA card: llama-cpp-python is a source package
    # there, and the server image has no C++ compiler to build it with (measured: "CMAKE_CXX_COMPILER
    # not set"). Everywhere else llama.cpp, for the GGUF builds, which pip builds with Metal on a Mac.
    # A Linux box without an NVIDIA card asks for the other one: `[llama]`.
    "vllm>=0.10; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "transformers>=4.45; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "llama-cpp-python>=0.3.16; sys_platform != 'linux' or platform_machine != 'x86_64'",
]

[project.optional-dependencies]
llama = ["llama-cpp-python>=0.3.16"]
vllm = ["vllm>=0.10", "transformers>=4.45"]

[tool.hatch.build.targets.wheel]
packages = ["src/rhapsode_engine_orpheus"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["torch.*", "snac.*", "llama_cpp.*", "vllm.*", "transformers.*", "numpy.*", "huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The conformance test spawns a real worker running this adapter, so tests/ has to be importable for
# the harness that puts fakes where llama.cpp and SNAC would be.
pythonpath = ["tests"]
timeout = 60
