[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rhapsode-engine-orpheus"
version = "0.0.0"
description = "Orpheus for rhapsode: a Llama that speaks in SNAC codes, and the second engine to perform cues."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "rhapsode-worker",
    "numpy>=1.26",
    # The Llama. A wheel for the CPU, built from source with Metal on a Mac (which needs the Xcode
    # command line tools), and for CUDA from its own index through PIP_EXTRA_INDEX_URL. The repository's
    # shared dev venv installs this package with --no-deps, so none of it is needed to test the adapter.
    "llama-cpp-python>=0.3.16",
    # The codec, which brings torch. It is the only part of this engine that needs it.
    "snac>=1.2.1",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
# The `full` build: Canopy's own weights through vLLM, on Linux with a CUDA card. Several gigabytes,
# and it pins its own torch, so it is asked for by name rather than installed with every engine.
vllm = ["vllm>=0.10", "transformers>=4.45"]

[tool.hatch.build.targets.wheel]
packages = ["src/rhapsode_engine_orpheus"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["torch.*", "snac.*", "llama_cpp.*", "vllm.*", "transformers.*", "numpy.*", "huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The conformance test spawns a real worker running this adapter, so tests/ has to be importable for
# the harness that puts fakes where llama.cpp and SNAC would be.
pythonpath = ["tests"]
timeout = 60
