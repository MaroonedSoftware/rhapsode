[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rhapsode-conform"
version = "0.0.0"
description = "Point it at a worker and it says whether that worker is one."
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
rhapsode-conform = "rhapsode_conform.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rhapsode_conform"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
strict = true
files = ["src"]
