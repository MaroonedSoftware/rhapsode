[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rhapsode-worker"
version = "0.1.14"
description = "The SDK an engine author subclasses: one class, and the worker protocol is handled."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # The response shapes are generated from contracts/rhapsode.types.ck as Pydantic models, so the
    # worker validates what it sends against the same declaration the core parses it with.
    "pydantic>=2.0",
    # Narrow on purpose. trailers.py writes § 6's duration trailer through uvicorn's h11 request
    # cycle, which is internals, and uvicorn is pre-1.0 and changes internals in minor releases. The
    # worker suite, the trailer test included, passed on every release tried from 0.33 to 0.53. Below
    # 0.33 uvicorn does not tell the app a client hung up, and the engine ran on for nobody. To raise
    # the ceiling, run the suite on the new minor.
    "uvicorn>=0.33,<0.54",
    "starlette>=0.37,<2.0",
    # Starlette parses a form with it and imports it only when asked to, so without it every
    # `POST /voices` died on an import error, reported as a 500, and nothing noticed because no test
    # uploaded anything. Chatterbox's own venv happened to have it through upstream's gradio.
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/MaroonedSoftware/rhapsode"

[tool.hatch.build.targets.wheel]
packages = ["src/rhapsode_worker"]
# Ships the py.typed marker, so an adapter author type-checks against the SDK rather than Any.
artifacts = ["src/rhapsode_worker/py.typed"]

[tool.ruff]
# Generated from contracts/. Linting a generator's output is a diff that comes back.
extend-exclude = ["src/**/_contract"]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
exclude = ["_contract"]
python_version = "3.11"
files = ["src"]

# torch is imported inside a try/except for device detection and must never become a dependency, so
# that an adapter with onnxruntime and no torch can still install this SDK. Its absence is normal.
[[tool.mypy.overrides]]
module = ["torch.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite spawns real worker processes, so tests/ has to be importable as a module root for the
# misbehaving engines under tests/engines/ and for conftest's helpers.
pythonpath = ["tests", "."]
asyncio_mode = "auto"
# A deadlock in a suite that spawns processes and streams over sockets otherwise wedges CI instead
# of failing it. Generous, because a cold start on a loaded runner is legitimately slow.
timeout = 60
