# The image from this checkout rather than from the registry. docs/operating.md § Docker.
#
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
#
# Tagged `local` rather than with a version, so a build never stands in for a release of the same
# number, and `docker compose pull` cannot replace what you built with what was published.
services:
    server:
        image: ghcr.io/maroonedsoftware/rhapsode:local
        build:
            context: .
            dockerfile: docker/Dockerfile
