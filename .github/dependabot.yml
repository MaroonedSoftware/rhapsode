version: 2

updates:
    # Every action is pinned to a commit, not a tag, because a tag can be moved to new code by
    # whoever controls that repository, and the release workflow runs with publish rights on npm and
    # the container registry. This is what keeps the pins from going stale.
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      groups:
          actions:
              patterns: ['*']

    # One pull request a week for the workspace, rather than one per package. The week's cooldown is
    # for the same reason pnpm has a minimum release age: a hijacked release is usually caught and
    # pulled within days, and nothing here needs a dependency on the day it ships.
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      open-pull-requests-limit: 5
      # TypeScript 7 fails every lint run with "typescript-eslint does not support TS 7.0" (#8).
      # Support is tracked in typescript-eslint/typescript-eslint#10940; drop this once it lands.
      ignore:
          - dependency-name: typescript
            update-types: ['version-update:semver-major']
      groups:
          minor-and-patch:
              update-types: [minor, patch]

    # Breeze's vendored inference code pins what upstream pins, and those pins are a set: torchaudio
    # 2.9.1 requires torch==2.9.1 exactly, and qwen-tts 0.1.1 requires transformers==4.57.3 exactly.
    # Security updates bumped torch to 2.13.0 (#71) and transformers to 5.10.1 (#70) on their own,
    # the tests passed because they fake torch and upstream, and 0.1.20 and 0.1.21 shipped an engine
    # pip cannot resolve: the install on the pop-os box failed on ResolutionImpossible in two seconds.
    # These move when upstream moves them, by hand. The entry exists only to carry the ignore, since
    # without one for this directory security updates ignore nothing; a limit of 0 opens no version
    # updates either.
    - package-ecosystem: pip
      directory: /python/rhapsode-vendor-breeze
      schedule:
          interval: weekly
      open-pull-requests-limit: 0
      ignore:
          - dependency-name: '*'

    # Fish pins upstream's torch 2.8.0 and torchaudio 2.8.0, and torchaudio requires that torch
    # exactly. A security update bumped torch alone to 2.13.0 (#88), the same unresolvable engine as
    # Breeze's above, and it went unblocked because the Breeze entry covers only its own directory.
    - package-ecosystem: pip
      directory: /python/rhapsode-engine-fish
      schedule:
          interval: weekly
      open-pull-requests-limit: 0
      ignore:
          - dependency-name: '*'
