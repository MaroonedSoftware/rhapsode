version: 2

updates:
    # Every action is pinned to a commit, not a tag, because a tag can be moved to new code by
    # whoever controls that repository, and the release workflow runs with publish rights on npm and
    # the container registry. This is what keeps the pins from going stale.
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      groups:
          actions:
              patterns: ['*']

    # One pull request a week for the workspace, rather than one per package. The week's cooldown is
    # for the same reason pnpm has a minimum release age: a hijacked release is usually caught and
    # pulled within days, and nothing here needs a dependency on the day it ships.
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      open-pull-requests-limit: 5
      # TypeScript 7 fails every lint run with "typescript-eslint does not support TS 7.0" (#8).
      # Support is tracked in typescript-eslint/typescript-eslint#10940; drop this once it lands.
      ignore:
          - dependency-name: typescript
            update-types: ['version-update:semver-major']
      groups:
          minor-and-patch:
              update-types: [minor, patch]
