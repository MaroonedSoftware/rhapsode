name: release

# A pushed `v*` tag publishes. `pnpm release version <x.y.z>` is what makes the commit to tag: it
# moves every published package to one version and folds the changesets into CHANGELOG.md.
on:
    push:
        tags: ['v*']

concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    versions:
        # First and cheapest. A tag that disagrees with any package would publish something under a
        # number nobody asked for, and § 9's one-version rule would be false from the first release.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  # No pnpm in this job. setup-node v5 turns caching on by itself when package.json
                  # names a packageManager, and then fails looking for pnpm before any step runs.
                  package-manager-cache: false
            - run: node scripts/release.mjs check "$GITHUB_REF_NAME"

    build:
        # The whole of CI, again, on exactly the commit being published.
        needs: [versions]
        uses: ./.github/workflows/build.yml

    # No PyPI job. Nothing reads the index yet (release.mjs, PYPI), so there is nothing to publish.
    # The job that was here is in git history: it built each directory with `python -m build`,
    # checked it with `twine check --strict`, and uploaded the SDK first by trusted publishing from
    # the `pypi` environment, because every engine pins the SDK exactly and cannot install before it.
    npm:
        needs: [build]
        runs-on: ubuntu-latest
        environment: npm
        permissions:
            contents: read
            # Trusted publishing: npm accepts this workflow's identity in place of a token, and
            # records provenance from the same one.
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: pnpm
                  registry-url: https://registry.npmjs.org

            # Trusted publishing needs npm 11.5.1 or later, and Node 22 ships npm 10. With an older
            # npm the OIDC token is never exchanged and the publish fails as unauthenticated.
            - run: npm install --global npm@^11.5.1

            - run: pnpm install --frozen-lockfile
            - run: pnpm run build

            # Packed by pnpm, because only pnpm rewrites `workspace:*` into the version being
            # released, and published by npm, because npm is what attaches provenance. In the order
            # `release.mjs list` gives, which is dependencies before dependents.
            #
            # A version already on the registry is skipped rather than failed, so a run that died
            # halfway is finished by re-running it, not by cutting a new version.
            #
            # No token. A package's first version, and the trust config that lets this job publish
            # the rest, come from `node scripts/npm.bootstrap.mjs`, run once by hand.
            - name: Publish
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  out="$RUNNER_TEMP/npm"
                  mkdir -p "$out"
                  for dir in $(node scripts/release.mjs list npm); do
                      name=$(node -p "require('./$dir/package.json').name")
                      if npm view "$name@$version" version >/dev/null 2>&1; then
                          echo "$name@$version is already published"
                          continue
                      fi
                      tarball=$(cd "$dir" && pnpm pack --pack-destination "$out" | tail -n 1)
                      npm publish "$tarball" --access public --provenance
                  done

    image:
        # Independent of npm: the server image installs engines from the Python sources baked into it
        # (`install.sourceDir`), so it is consistent with itself and needs no package index.
        needs: [build]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # arm64 as well, under emulation, because Docker on an Apple Silicon Mac runs arm64 and
            # an amd64-only image there is emulated on every request instead of once per release.
            - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
            - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}

            # The version, its minor line, and `latest`, which the metadata action moves only for a
            # plain x.y.z tag. It also labels the image with this repository, which is what links the
            # package to it on GitHub.
            - id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ghcr.io/maroonedsoftware/rhapsode
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}

            - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  file: docker/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    github:
        needs: [npm, image]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  # No pnpm in this job. setup-node v5 turns caching on by itself when package.json
                  # names a packageManager, and then fails looking for pnpm before any step runs.
                  package-manager-cache: false
            - name: Release notes, from CHANGELOG.md
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  node scripts/release.mjs notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
                  gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
