name: image

# The server image for amd64 and arm64, each on a runner of its own architecture, joined into one
# multi-platform tag afterwards. arm64 was built under QEMU on an amd64 runner, and v0.1.0 spent 12.5
# minutes there against 2.5 for amd64: 310s for the apt-get layer alone that amd64 does in 58s.
#
# No top-level `permissions`, on purpose. A called workflow can only narrow its caller's token, so
# the jobs take theirs from the job that calls this: `packages: write` from a release, read-only
# from a push to main.
on:
    workflow_call:
        inputs:
            push:
                description: Push the image and tag it. Without it this only builds, and fills the cache.
                type: boolean
                required: true

env:
    IMAGE: ghcr.io/maroonedsoftware/rhapsode

jobs:
    platform:
        strategy:
            matrix:
                include:
                    - arch: amd64
                      runner: ubuntu-24.04
                    - arch: arm64
                      runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - if: inputs.push
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}

            # Labels only; the tags go on in `manifest`. The source label is what links the package
            # to this repository on GitHub.
            - id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ env.IMAGE }}

            # Pushed by digest, untagged, so neither platform is ever published alone under a
            # version. The cache is per architecture, or each would overwrite the other's. A tag's
            # run can read only its own cache and main's, which is why main builds this too: v0.1.1
            # imported v0.1.0's cache and hit nothing.
            - id: build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: docker/Dockerfile
                  platforms: linux/${{ matrix.arch }}
                  labels: ${{ steps.meta.outputs.labels }}
                  outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ inputs.push }}
                  cache-from: type=gha,scope=image-${{ matrix.arch }}
                  cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max

            - if: inputs.push
              env:
                  DIGEST: ${{ steps.build.outputs.digest }}
              run: |
                  mkdir -p "$RUNNER_TEMP/digests"
                  touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

            - if: inputs.push
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: digest-${{ matrix.arch }}
                  path: ${{ runner.temp }}/digests/*
                  if-no-files-found: error
                  retention-days: 1

    manifest:
        # The one step that publishes: both digests under the version, its minor line, and
        # `latest`, which the metadata action moves only for a plain x.y.z tag.
        if: inputs.push
        needs: [platform]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: digest-*
                  path: ${{ runner.temp }}/digests
                  merge-multiple: true

            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}

            # Annotations at the index level too, because GHCR reads the source link from the index
            # of a multi-platform image, and `imagetools create` writes one with none of its own.
            - id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              env:
                  DOCKER_METADATA_ANNOTATIONS_LEVELS: index
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}

            - working-directory: ${{ runner.temp }}/digests
              run: |
                  args=()
                  while IFS= read -r tag; do args+=(--tag "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
                  while IFS= read -r note; do args+=(--annotation "$note"); done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
                  for digest in *; do args+=("$IMAGE@sha256:$digest"); done
                  docker buildx imagetools create "${args[@]}"
                  docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
