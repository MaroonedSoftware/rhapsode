name: site

# The public website, published to GitHub Pages at https://maroonedsoftware.github.io/rhapsode/.
#
# Only on a push to `main` that can change what the site says. The API reference is committed under
# `apps/site`, so a contract change reaches the site through the first path below. The protocol, the
# operator guide, CONTRIBUTING.md, the package READMEs, the OpenAPI document and the favicon are read
# from outside the package, which is why they are listed too; `turbo.json` lists the same files as
# the site's build inputs. Whether the site still BUILDS is already proved on every pull request:
# `build.yml` runs `pnpm build`, which includes it, and a broken link fails that build.
on:
    push:
        branches: [main]
        paths:
            - 'apps/site/**'
            - 'apps/web/public/**'
            - 'docs/operating.md'
            - 'docs/protocol.md'
            - 'docs/openapi.yaml'
            - 'CONTRIBUTING.md'
            - 'python/*/README.md'
            - 'pnpm-lock.yaml'
            - '.github/workflows/site.yml'
    workflow_dispatch:

permissions:
    contents: read

# One deployment at a time, and a queued one is never cancelled: Pages publishes whichever finishes
# last, so cancelling the older run is what could leave the older site up.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: pnpm

            # Fails here, with a message saying so, if Pages is not set to deploy from Actions.
            - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            # The site and what it depends on, not the server: nothing here needs the core's
            # dependencies, the page's or Python.
            - name: Install the site's dependencies
              run: pnpm install --frozen-lockfile --filter '@rhapsode/site...'

            - name: Build
              run: pnpm --filter @rhapsode/site build

            - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: apps/site/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10

        # The only job with any write access, and only to Pages.
        permissions:
            pages: write
            id-token: write

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
