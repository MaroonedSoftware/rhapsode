name: build

on:
    workflow_call:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

            - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
              with:
                  node-version: 22
                  cache: pnpm

            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
              with:
                  python-version: '3.11'

            # Every format in capabilities.formats has to actually produce bytes in that format, so
            # the encoder is not something the suite can stub. A runner without ffmpeg would pass a
            # worker that only ever serves pcm and wav.
            - name: Install ffmpeg
              run: sudo apt-get update && sudo apt-get install -y ffmpeg

            - run: pnpm install --frozen-lockfile
            - run: pnpm run python:sync

            - run: pnpm run format:check
            - run: pnpm run codegen:check
            - run: pnpm run build
            - run: pnpm run typecheck
            - run: node scripts/python.mjs typecheck
            - run: pnpm run lint
            - run: node scripts/python.mjs lint
            - run: pnpm run test

            # The suite an engine author runs before opening a pull request, against the engine that
            # exists to prove the protocol. If this passes and their engine fails it, the difference
            # is theirs; if it fails here, the difference is ours.
            - name: Conformance, against the reference engine
              run: node scripts/conform.mjs

    docker:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  persist-credentials: false

            - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
              with:
                  node-version: 22
                  # No pnpm in this job. setup-node v5 turns caching on by itself when package.json
                  # names a packageManager, and then fails looking for pnpm before any step runs.
                  package-manager-cache: false

            # Builds both images from scratch, which is also the check that the Dockerfile still
            # matches the workspace. The install it makes has to survive its containers being
            # replaced, because that is the only reason the volumes exist.
            - name: The images, and an install that outlives its containers
              run: node scripts/docker.smoke.mjs
