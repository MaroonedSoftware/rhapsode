packages:
    - apps/*
    - packages/*

allowBuilds:
    # Pulled in by ServerKit's authentication package. Builds a native addon.
    cbor-extract: true
    esbuild: true
    # The swc binary behind `pnpm wizard`, which runs the CLI from TypeScript source.
    '@swc/core': true

minimumReleaseAgeExclude:
    - '@maroonedsoftware/*'
    - '@contractkit/*'

# pnpm's pre-run dependency check misfires in sandboxed sessions, where the store path drifts.
# Warn rather than trying to reinstall underneath a running command.
verifyDepsBeforeRun: warn
